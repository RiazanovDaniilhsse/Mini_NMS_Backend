version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: nms-postgres
    environment:
      POSTGRES_DB: nms_db
      POSTGRES_USER: nms_user
      POSTGRES_PASSWORD: nms_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: