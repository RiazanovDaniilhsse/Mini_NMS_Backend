spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false # Отключаем Flyway для тестов
  kafka:
    bootstrap-servers: localhost:9999 # Чтобы тесты не падали, если Kafka не запущена
    consumer:
      group-id: test-group
      auto-offset-reset: earliest