spring:
  application:
    name: mini-nms-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/nms_db
    username: nms_user
    password: nms_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: nms-backend-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.use.type.headers: true
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >
          com.nms.poller.kafka.DoubleMetricEvent:org.project.metric.dto.event.NumericMetricEventDto,
          com.nms.poller.kafka.BooleanMetricEvent:org.project.metric.dto.event.BooleanMetricEventDto,
          com.nms.poller.kafka.StringMetricEvent:org.project.metric.dto.event.StringMetricEventDto,
          com.nms.poller.kafka.DeviceTimeoutEvent:org.project.metric.dto.event.TimeoutMetricEventDto