spring:
  application:
    name: mini-nms-backend
  datasource:
    url: jdbc:postgresql://localhost:5433/nms_db
    username: nms_user
    password: nms_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true